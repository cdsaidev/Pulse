name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prepare environment
        run: |
          vercel env pull .env --environment=preview --yes --token=${{ secrets.VERCEL_TOKEN }}

          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a

          PRISMA_URL="${DATABASE_PRISMA_DATABASE_URL:-${POSTGRES_PRISMA_URL:-${DATABASE_URL:-}}}"
          DIRECT_URL="${DATABASE_POSTGRES_URL:-${POSTGRES_URL_NON_POOLING:-${DATABASE_URL_UNPOOLED:-}}}"

          if [ -n "$PRISMA_URL" ]; then
            echo "DATABASE_PRISMA_DATABASE_URL=$PRISMA_URL" >> .env
          fi
          if [ -n "$DIRECT_URL" ]; then
            echo "DATABASE_POSTGRES_URL=$DIRECT_URL" >> .env
          fi

          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a

          if [ -z "${DATABASE_PRISMA_DATABASE_URL:-}" ] || [ -z "${DATABASE_POSTGRES_URL:-}" ]; then
            echo "Missing DATABASE_PRISMA_DATABASE_URL or DATABASE_POSTGRES_URL."
            cut -d= -f1 .env | grep -Ei 'POSTGRES|DATABASE' || true
            exit 1
          fi

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.preview_url }}";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployment is ready: ${url}`
            });

  deploy-production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prepare environment
        run: |
          vercel env pull .env --environment=production --yes --token=${{ secrets.VERCEL_TOKEN }}

          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a

          PRISMA_URL="${DATABASE_PRISMA_DATABASE_URL:-${POSTGRES_PRISMA_URL:-${DATABASE_URL:-}}}"
          DIRECT_URL="${DATABASE_POSTGRES_URL:-${POSTGRES_URL_NON_POOLING:-${DATABASE_URL_UNPOOLED:-}}}"

          if [ -n "$PRISMA_URL" ]; then
            echo "DATABASE_PRISMA_DATABASE_URL=$PRISMA_URL" >> .env
          fi
          if [ -n "$DIRECT_URL" ]; then
            echo "DATABASE_POSTGRES_URL=$DIRECT_URL" >> .env
          fi

          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a

          if [ -z "${DATABASE_PRISMA_DATABASE_URL:-}" ] || [ -z "${DATABASE_POSTGRES_URL:-}" ]; then
            echo "Missing DATABASE_PRISMA_DATABASE_URL or DATABASE_POSTGRES_URL."
            cut -d= -f1 .env | grep -Ei 'POSTGRES|DATABASE' || true
            exit 1
          fi

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
